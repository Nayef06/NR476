<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>476 Apparel Scheduler</title>
    <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">

</head>

<body>

    <div class="container">
        <div class="config-grid no-print">
            <div class="input-group"><label>Store Opens</label><input type="time" id="storeOpen" value="10:00"></div>
            <div class="input-group"><label>Store Closes</label><input type="time" id="storeClose" value="21:00"></div>
        </div>
        <div id="workersContainer" class="no-print"></div>
        <div class="button-group no-print">
            <button class="btn-add" onclick="addWorkerRow()">+ Add Worker</button>
            <button class="btn-add" onclick="clearWorkers()" title="Remove all worker entries">× Clear All Workers</button>
        </div>
        <button class="btn-gen no-print" onclick="generate()">Generate Optimized Schedule</button>

        <div id="results" style="display:none;">
            <section class="timeline-section" aria-labelledby="timelineTitle">
                <div class="section-heading">
                    <div>
                        <h2 id="timelineTitle">Shift Coverage</h2>
                        <p>Drag breaks and lunches in 15-minute steps. Floor count excludes those and fitting-room assignments.</p>
                    </div>
                    <div id="coverageStatus" class="coverage-status" aria-live="polite"></div>
                </div>
                <div class="timeline-legend" aria-label="Timeline legend">
                    <span><i class="legend-swatch work"></i>Working</span>
                    <span><i class="legend-swatch break"></i>Break</span>
                    <span><i class="legend-swatch lunch"></i>Lunch</span>
                    <span><i class="legend-swatch fitting"></i>Fitting room</span>
                    <span><i class="legend-swatch uncovered"></i>Nobody on floor</span>
                </div>
                <div id="shiftTimeline" class="shift-timeline"></div>
            </section>
            <div class="results-grid">
                <div>
                    <div class="table-section-heading">
                        <h2>Floor & Breaks</h2>
                        <label class="auto-update-toggle" title="When off, press Enter to apply a table edit">
                            <input type="checkbox" id="autoUpdateToggle" checked>
                            <span aria-hidden="true"></span>
                            Auto update
                        </label>
                    </div>
                    <table id="breaksTable">
                        <thead>
                            <tr>
                                <th style="width:120px">Worker</th>
                                <th>Break 1</th>
                                <th>Lunch</th>
                                <th>Break 2</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
                <div>
                    <h2>Fitting Room Rotation</h2>
                    <table id="fittingRoomTable">
                        <thead>
                            <tr>
                                <th style="width:142px">Time</th>
                                <th>Greeter</th>
                                <th>Sorter</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <dialog id="moveConfirmDialog" class="move-dialog">
        <form method="dialog">
            <h3>Move this break?</h3>
            <p id="moveConfirmMessage"></p>
            <label class="dialog-checkbox">
                <input type="checkbox" id="skipMoveConfirm">
                Don’t ask again
            </label>
            <div class="dialog-actions">
                <button value="cancel" class="dialog-cancel">Cancel</button>
                <button value="confirm" class="dialog-confirm">Move break</button>
            </div>
        </form>
    </dialog>

    <div id="dragTimeTooltip" class="drag-time-tooltip" role="status" aria-live="polite"></div>

    <script src="script.js"></script>
</body>

</html>
